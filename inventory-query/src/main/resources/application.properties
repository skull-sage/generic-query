spring.application.name=inventory-query
server.port=${SERVER_PORT:8082}

# Inventory domain projection store. query-engine creates its own tables (drafts, published
# queries, identity catalog) in this same database on startup; the projection tables are seeded
# by docker/init. Defaults target the dockerized Postgres from docker/docker-compose.yml (host
# port 5434), so `./gradlew :inventory-query:bootRun` works with only the database container running.
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://localhost:5434/inventory_query}
spring.r2dbc.username=${DB_USERNAME:inventory_query}
spring.r2dbc.password=${DB_PASSWORD:inventory_query}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=${R2DBC_POOL_INITIAL_SIZE:5}
spring.r2dbc.pool.max-size=${R2DBC_POOL_MAX_SIZE:20}
spring.r2dbc.pool.max-idle-time=${R2DBC_POOL_MAX_IDLE_TIME:30m}

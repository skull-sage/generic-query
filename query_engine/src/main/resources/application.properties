spring.application.name=query_engine
server.port=${SERVER_PORT:8080}

# Reactive (R2DBC) datasource -- the whole engine is non-blocking end to end: WebFlux controllers
# -> reactive service -> R2DBC via DatabaseClient. The connection pool is the real backpressure
# valve against Postgres; size max-size to what the database can handle, not to request volume.
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://localhost:5432/generic_query}
spring.r2dbc.username=${DB_USERNAME:generic_query}
spring.r2dbc.password=${DB_PASSWORD:generic_query}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=${R2DBC_POOL_INITIAL_SIZE:5}
spring.r2dbc.pool.max-size=${R2DBC_POOL_MAX_SIZE:20}
spring.r2dbc.pool.max-idle-time=${R2DBC_POOL_MAX_IDLE_TIME:30m}

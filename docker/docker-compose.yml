name: query-engine

services:
  postgres:
    image: postgres:14-alpine
    container_name: query-engine-postgres
    environment:
      POSTGRES_DB: generic_query
      POSTGRES_USER: generic_query
      POSTGRES_PASSWORD: generic_query
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U generic_query -d generic_query"]
      interval: 2s
      timeout: 3s
      retries: 30

  # query_engine runs containerized so stopping/starting it (docker compose stop/start
  # query-engine, or `docker stop`/`docker start query-engine`) is a convenient manual way to
  # prove it keeps no in-memory lifecycle state: every draft/published query lives in Postgres
  # (see DraftStore/PublishedQueryRepository), so a restarted container should serve the exact
  # same /engine/list and /data-query results it did before being stopped.
  query-engine:
    build:
      context: ../query_engine
      dockerfile: Dockerfile
    container_name: query-engine-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/generic_query
      DB_USERNAME: generic_query
      DB_PASSWORD: generic_query
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
